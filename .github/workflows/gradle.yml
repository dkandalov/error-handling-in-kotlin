name: CI

on:
  push:
    branches: [ trunk ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: openjdk
          java-version: '21'
          cache: gradle
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew check
